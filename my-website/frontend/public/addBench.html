<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Bench</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>
  <header>
    <h1>Add Bench</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="seekBench.html">Seek Bench</a></li>
        <li><a href="addBench.html">Add Bench</a></li>
      </ul>
    </nav>
  </header>

  <div id="map-container">
    <div id="map"></div>
    <div id="button-container">
      <button type="button" id="find-location-btn">Find My Location</button>
      <button type="button" id="add-current-location-btn">Add Bench at Current Location</button>
    </div>
  </div>

  <div id="form-container">
    <form id="bench-form">
      <input type="hidden" id="lat" name="lat">
      <input type="hidden" id="lng" name="lng">
      <label for="type">Bench Type:</label>
      <select id="type" name="type" required>
        <option value="municipal">Municipal Bench</option>
        <option value="private">Private Bench</option>
      </select><br>
      <label for="place">Place:</label>
      <input type="text" id="place" name="place" required><br>
      <label for="rating">Rating (out of 10):</label>
      <input type="range" id="rating" name="rating" min="1" max="10" required><br>
      <label for="material">Material:</label>
      <select id="material" name="material" required>
        <option value="metal">Metal</option>
        <option value="wood">Wood</option>
        <option value="plastic">Plastic</option>
      </select><br>
      <button type="submit">Add Bench</button>
      <button type="button" id="cancel-btn">Cancel</button>
    </form>
    
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="js/addBench.js"></script>

</body>
</html>
