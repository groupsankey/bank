<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Example</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>My Zoomable Map</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    // Initialize the map and set its view to Tunalı Hilmi Street in Çankaya, Ankara, Turkey
    var map = L.map('map').setView([39.9117, 32.8606], 13);

    // Add a tile layer to the map using OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Define a custom icon
    var benchIcon = L.icon({
      iconUrl: 'bench.png', // Path to your custom icon image
      iconSize: [38, 38],   // Size of the icon
      iconAnchor: [19, 38], // Point of the icon which will correspond to marker's location
      popupAnchor: [0, -38] // Point from which the popup should open relative to the iconAnchor
    });

    // Add a marker with the custom icon to the specified coordinates
    var bookmarkCoords = [39.9117, 32.8606];
    var marker = L.marker(bookmarkCoords, { icon: benchIcon }).addTo(map);

    // Bind a popup to the marker with a custom message
    marker.bindPopup('<b>Bookmark</b><br>This is Tunalı Hilmi Street.').openPopup();
  </script>
</body>
</html>
